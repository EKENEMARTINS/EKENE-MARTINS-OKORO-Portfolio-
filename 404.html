<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131c">
    <title>Page not found | Ekene Martins Okoro</title>
    <link rel="icon" href="assets/logo-dark.png">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .error-page { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 30px; }
        .error-page .brand.logo { margin: 0 auto 20px; }
        .error-code {
        font: 800 clamp(100px, 22vw, 190px)/.9 Manrope, sans-serif; letter-spacing: -12px;
        background: linear-gradient(110deg, var(--accent), var(--accent2));
        background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .error-page h1 { font-size: clamp(25px, 5vw, 42px); letter-spacing: -2px; margin: 15px 0; }
        .error-page p { max-width: 440px; color: var(--muted); font-size: 13px; margin: 0 auto 25px; }
    </style>
    </head>
<body>
    <main class="error-page">
        <div>
        <a class="brand logo" href="index.html" aria-label="Ekene Martins Okoro home">
            <img class="logo logo-dark" src="assets/logo-dark.png" alt="Ekene Martins Okoro logo" width="40" height="40">
            <img class="logo logo-light" src="assets/logo-light.png" alt="" aria-hidden="true" width="40" height="40">
        </a>
        <div class="error-code">404</div>
        <h1>This page took a wrong turn.</h1>
        <p>The page you're looking for may have moved, or the link may be outdated. Let's get you back to the portfolio.</p>
        <a class="button button-primary" href="index.html">Return to homepage ↗</a>
        </div>
    </main>
</body>
</html>
